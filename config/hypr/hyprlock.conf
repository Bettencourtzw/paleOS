# Lock screen — minimal: big thin clock, date, small password pill.
# Colors: fg e6e6e6, dim 7a7a7a, red e06c6c

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

animations {
    enabled = true
    animation = fadeIn, 1, 4, default
    animation = fadeOut, 1, 4, default
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper
    blur_passes = 4
    blur_size = 6
    brightness = 0.45
    contrast = 0.9
    vibrancy = 0
}

# clock
label {
    monitor =
    text = cmd[update:1000] echo "<span font_weight='200'>$(date +%H:%M)</span>"
    color = rgba(e6e6e6ff)
    font_size = 132
    font_family = JetBrainsMono Nerd Font
    position = 0, 170
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +'%A, %d %B' | tr '[:lower:]' '[:upper:]'
    color = rgba(e6e6e6aa)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# password pill
input-field {
    monitor =
    size = 300, 46
    position = 0, -260
    halign = center
    valign = center
    rounding = 23
    outline_thickness = 1
    outer_color = rgba(ffffff22)
    inner_color = rgba(0e0e0ecc)
    font_color = rgba(e6e6e6ff)
    check_color = rgba(e6e6e655)
    fail_color = rgba(e06c6cff)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##7a7a7a">󰌾  Enter password</span>
    fail_text = <span foreground="##e06c6c">Wrong password</span>
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    hide_input = false
    shadow_passes = 0
}

# hint
label {
    monitor =
    text = Locked
    color = rgba(7a7a7aff)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
