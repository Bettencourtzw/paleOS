general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

# 5 min idle: screensaver (like Omarchy)
listener {
    timeout = 300
    on-timeout = ~/.local/bin/screensaver
}

# 10 min idle: lock (SUPER + CTRL + I toggles idle locking)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
