# paleOS — private DNS. Every lookup goes encrypted (DNS-over-TLS) to Quad9, with DNSSEC.
# NetworkManager is set to NOT pass your router's/ISP's DNS on (see NetworkManager/paleos.conf),
# so nothing leaks around this. To use another provider, change DNS= below.
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
FallbackDNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com
DNSOverTLS=yes
DNSSEC=allow-downgrade
Domains=~.
LLMNR=no
MulticastDNS=no
