# paleOS — keep DNS private and connections less trackable.
# (NetworkManager doesn't allow comments after a value, so they go on their own lines.)
[main]
# Don't hand DHCP/ISP DNS to the system; systemd-resolved (encrypted Quad9) decides.
dns=none
rc-manager=unmanaged

[connection]
# Temporary IPv6 addresses
ipv6.ip6-privacy=2
# A different, stable MAC address per Wi-Fi network
wifi.cloned-mac-address=stable
